<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship/Job Opportunity Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Internship/Job Opportunity Portal</h1>
    <p>Find internships and job opportunities tailored for students</p>
  </header>

  <main>
    <input type="text" id="searchBox" placeholder="Search by title, company, or location...">

    <div class="job-list">
      <div class="job-card">
        <h3>Frontend Developer Intern</h3>
        <p><strong>Company:</strong> TechCorp</p>
        <p><strong>Location:</strong> Lagos</p>
        <button>Apply Now</button>
      </div>

      <div class="job-card">
        <h3>Backend Developer Intern</h3>
        <p><strong>Company:</strong> DataSoft</p>
        <p><strong>Location:</strong> Abuja</p>
        <button>Apply Now</button>
      </div>

      <div class="job-card">
        <h3>UI/UX Design Intern</h3>
        <p><strong>Company:</strong> DesignHub</p>
        <p><strong>Location:</strong> Remote</p>
        <button>Apply Now</button>
      </div>
    </div>
  </main>

</body>
</html>
